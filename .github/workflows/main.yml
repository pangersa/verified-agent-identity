name: Verify Human Identity

on:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: pangersa
        uses: actions/checkout@v3

      - name: pangersa
        uses: actions/setup-node@v3
        with:
          node-version: "20"

      - name: pangersa
        run: npm install -g clawhub

      - name: Install Verified Agent Identity
        run: clawhub install verified-agent-identity

      - name: pangersa
        run: |
          cd scripts
          npm install

      - name: pangersa
        run: node scripts/createNewEthereumIdentity.js

      - name: pangersa
        run: |
          node scripts/manualLinkHumanToAgent.js --challenge '{pangersa, AI Agent"}'
